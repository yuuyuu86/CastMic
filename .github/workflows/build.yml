name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: apple
        run: xcodegen
      - name: Build macOS
        working-directory: apple
        run: xcodebuild -project CastMic.xcodeproj -scheme CastMic -destination 'platform=macOS' build CODE_SIGNING_ALLOWED=NO
      - name: Build iOS
        working-directory: apple
        run: xcodebuild -project CastMic.xcodeproj -scheme CastMic -destination 'generic/platform=iOS' build CODE_SIGNING_ALLOWED=NO

  windows-app:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish
        run: dotnet publish windows/CastMic.Windows -c Release -r win-x64 --self-contained false -o out/app
      - uses: actions/upload-artifact@v4
        with:
          name: CastMic-Windows
          path: out/app

  driver:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64 # x86 版だと InfVerif.dll が読めない
      - name: Build driver (x64, test-signed)
        run: msbuild driver/CastMicAudio/CastMicAudio.vcxproj /p:Configuration=Release /p:Platform=x64 /m
      - uses: actions/upload-artifact@v4
        with:
          name: CastMicAudio-driver-x64
          path: |
            driver/CastMicAudio/x64/Release/CastMicAudio/
            driver/CastMicAudio/x64/Release/*.cer
